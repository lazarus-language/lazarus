<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAZARUS s'appelle maintenant Larkhré</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://larkhre.github.io/code/">
<style>
  body{ margin:0; min-height:100vh; display:grid; place-items:center; background:#1c1611; color:#f5e9d6;
        font-family:system-ui,'Segoe UI',sans-serif; font-size:18px; line-height:1.5; text-align:center; padding:2rem; }
  h1{ font-family:Georgia,serif; font-size:2.2rem; margin:0 0 .6rem; }
  a{ color:#f5e9d6; font-weight:700; }
</style>
</head>
<body>
<main>
  <h1>LAZARUS s'appelle maintenant Larkhré</h1>
  <p><em>Mosi larkhré</em> : la langue de la machine, en soninké.</p>
  <p>Tu vas être redirigé vers le nouveau playground. Sinon :
     <a id="lien" href="https://larkhre.github.io/code/">larkhre.github.io/code</a></p>
</main>
<script>
(function () {
  var cible = 'https://larkhre.github.io/code/';
  var donnees = {};
  try {
    ['lazarus_memoire', 'lazarus_ecole'].forEach(function (k) {
      var v = localStorage.getItem(k);
      if (v) donnees[k] = v;
    });
  } catch (e) {}
  var url = cible;
  if (Object.keys(donnees).length) {
    try { url += '?reprise=' + encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(donnees))))); } catch (e) {}
  }
  url += location.hash;   // garde les liens partagés (#code=...)
  document.getElementById('lien').href = url;
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); }).catch(function () {});
  }
  location.replace(url);
})();
</script>
</body>
</html>
