[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lazarus-lang"
version = "7.1.0"
description = "LAZARUS — le langage de programmation de Ladji : accolades comme Java, simplicité de Python, mots-clés uniques (laz, fonk, kan, klas...). v7 : MODE INTERFACE (applications à boutons et champs), MODE JEU temps réel (30 images/s, clavier, sons), mots-clés multilingues, variables persistantes garde, ralenti pédagogique, traducteur Python x50, mode dessin, couleurs, classes."
readme = "README.md"
authors = [{ name = "Ladji Doucaré" }]
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["langage", "programmation", "interpreteur", "lazarus", "education", "francais"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Interpreters",
    "Intended Audience :: Education",
    "Natural Language :: French",
]

[project.urls]
Homepage = "https://github.com/ladjidoucare994-boop/lazarus"
Documentation = "https://github.com/ladjidoucare994-boop/lazarus/blob/main/GUIDE_LAZARUS.md"
Playground = "https://ladjidoucare994-boop.github.io/lazarus/"

[project.scripts]
lazarus = "lazarus:main"

[tool.setuptools]
py-modules = ["lazarus"]
